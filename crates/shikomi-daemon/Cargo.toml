[package]
name = "shikomi-daemon"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# テスト専用公開 API（`HotkeyManager::new_null`）を有効化する。
# 本番バイナリには含まれない。統合テストのみで有効化する（justfile `test-daemon` 参照）。
test-fixtures = []

# lib + bin の 2 ターゲット構成（cli-vault-commands と同型）
# - lib: run() / 内部公開 API を結合テスト（tests/）から呼び出すため
# - bin: `#[tokio::main(flavor = "multi_thread")]` で run() を呼ぶ薄ラッパ
[lib]
name = "shikomi_daemon"
path = "src/lib.rs"

[[bin]]
name = "shikomi-daemon"
path = "src/main.rs"

[dependencies]
shikomi-core       = { workspace = true }
shikomi-infra      = { workspace = true }
serde              = { workspace = true }
thiserror          = { workspace = true }
time               = { workspace = true }
uuid               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
dirs               = { workspace = true }
tokio              = { workspace = true }
tokio-util         = { workspace = true }
# Sub-E (#43) `OsLockSignal` trait の `async fn` を `Send + 'static` future 制約で
# dyn 化するための async-trait macro (vek-cache-and-ipc.md §OsLockSignal trait)。
async-trait        = { workspace = true }
rmp-serde          = { workspace = true }
bytes              = { workspace = true }
futures-util       = { workspace = true }
fs4                = { workspace = true }

# Issue #89: グローバルホットキー + クリップボード + OS 通知
global-hotkey      = { workspace = true }
arboard            = { workspace = true }
notify-rust        = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix                = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys        = { workspace = true }

[dev-dependencies]
tempfile           = { workspace = true }
assert_cmd         = { workspace = true }
predicates         = { workspace = true }
# Pegasus 工程5 致命指摘 ④ TC-E-I06c で `FORCE_RELOCK_FAILURE` (debug_assertions
# 限定 AtomicBool) を共有する rekey/rotate_recovery 系テストを直列化するため。
serial_test        = { workspace = true }
# Issue #89 テスト: tokio::time::pause / advance でタイマー時間制御
tokio              = { workspace = true, features = ["test-util"] }
# Issue #80 TC-IT-102: shikomi_daemon::init target の INFO ログを in-memory で観測する。
# no-env-filter feature により別 crate (shikomi-infra 等) のログも全捕捉する。
tracing-test       = { workspace = true }

# pty 経由 E2E（Issue #33 / TC-E2E-017、Unix 限定）。
# `e2e_daemon_phase15_pty.rs` のみで使用、本番バイナリ非混入。
[target.'cfg(unix)'.dev-dependencies]
expectrl           = { workspace = true }

[lints]
workspace = true
